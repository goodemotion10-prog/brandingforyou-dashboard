<!DOCTYPE html><html><head><meta charset="utf-8"><title>Naver Keyword Tool</title><link rel="stylesheet" href="../assets/style.css"></head><body><div class="container"><a class="back-link" href="/">[Back]</a>a><h1>Naver Gold Keyword</h1><div class="input-group"><input id="kw" placeholder="Keyword"><button onclick="s()">Analyze</button>button></div>div><div id="ld" style="display:none">Loading...</div>div><table border="1"><thead><tr><th>Keyword</th><th>Volume</th><th>Docs</th><th>Ratio</th></tr></thead><tbody id="res"></tbody>tbody></table>table></div>div><script>async function s(){const k=document.getElementById('kw').value;if(!k)return;const ld=document.getElementById('ld');ld.style.display='block';document.getElementById('res').innerHTML='';try{const r=await fetch('/api/naver-search?keyword='+encodeURIComponent(k));const d=await r.json();document.getElementById('res').innerHTML=d.map(i=>'<tr><td>'+i.keyword+'</td><td>'+parseInt(i.searchVolume).toLocaleString()+'</td><td>'+parseInt(i.blogCount).toLocaleString()+'</td><td>'+parseFloat(i.ratio).toFixed(2)+'%</td></tr>').join('');}catch(e){alert('Error')}finally{ld.style.display='none'}}</script></body></html></script></th></th></tr></thead></h1></body></title></head></html>
