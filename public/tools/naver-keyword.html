<!DOCTYPE html>
<html>
  <head><meta charset="utf-8"><title>Naver</title><link rel="stylesheet" href="../assets/style.css"></head>
<body>
  <div class="tool-container">
    <h1>Naver Keyword</h1>
  <input id="kw"><button onclick="s()">Search</button>button>
  <div id="ld" style="display:none">Loading...</div>div>
  <table class="keyword-table"><thead><tr><th>KW</th><th>Vol</th><th>Blog</th><th>Ratio</th></tr></thead><tbody id="res"></tbody>tbody></table>table>
  </div>div>
<script>
  async function s(){
    const k=document.getElementById('kw').value;
    const ld=document.getElementById('ld');
    ld.style.display='block';
    try{
      const r=await fetch('/api/naver-search?keyword='+k);
      const d=await r.json();
      document.getElementById('res').innerHTML=d.map(i=>`<tr><td>${i.keyword}</td><td>${i.searchVolume}</td><td>${i.blogCount}</td><td>${i.ratio}</td></tr>`).join('');
    }catch(e){alert('Error')}
    finally{ld.style.display='none'}
  }
</script>
</body>
</html>
</script></th></th></tr></thead></h1>
</body></title></head>
</html>
