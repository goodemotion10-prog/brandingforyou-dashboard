<!DOCTYPE html>
<html lang="ko">
  <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Naver Keyword Tool - BrandingForYou</title>
      <link rel="stylesheet" href="../assets/style.css">
  </head>
<body>
      <div class="tool-container">
                <h1>Naver Keyword Analysis</h1>
              <div class="input-group">
                          <input type="text" id="keyword-input" placeholder="Enter keyword to analyze">
                          <button onclick="searchKeywords()">Analyze</button>button>
              </div>div>
              <div id="loader" style="display:none">Analyzing...</div>div>
              <table class="keyword-table">
                          <thead>
                                            <tr>
                                                                  <th>Keyword</th>
                                              <th>Volume</th>
                                              <th>Blogs</th>
                                              <th>Ratio</th>
                                              <th>Action</th>
                                            </tr>
                          </thead>
                          <tbody id="keyword-list"></tbody>tbody>
              </table>table>
      </div>div>
    <script>
              async function searchKeywords() {
                            const keyword = document.getElementById('keyword-input').value;
                            if (!keyword) return alert('Please enter a keyword.');
                            const loader = document.getElementById('loader');
                            loader.style.display = 'block';
                            try {
                                              const res = await fetch(`/api/naver-search?keyword=${encodeURIComponent(keyword)}`);
                                              const data = await res.json();
                                              const list = document.getElementById('keyword-list');
                                              list.innerHTML = data.map(item => `
                                                                  <tr>
                                                                                          <td>${item.keyword}</td>
                                                                                                                  <td>${item.searchVolume.toLocaleString()}</td>
                                                                                                                                          <td>${item.blogCount.toLocaleString()}</td>
                                                                                                                                                                  <td>${item.ratio}</td>
                                                                                                                                                                                          <td><button onclick="navigator.clipboard.writeText('${item.keyword}')">Copy</button></td>
                                                                                                                                                                                                              </tr>
                                                                                                                                                                                                                              `).join('');
                            } catch (e) { alert('An error occurred.'); }
                            finally { loader.style.display = 'none'; }
              }
    </script>
</body>
</html>html>
